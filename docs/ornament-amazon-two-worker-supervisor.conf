[program:xlap-ornament-amazon-two-pipeline]
process_name=%(program_name)s_%(process_num)02d
directory=/www/wwwroot/xlap.tech
command=/www/server/php/83/bin/php artisan queue:work database --queue=ornament-pipeline --sleep=1 --tries=1 --timeout=3600 --backoff=10 --memory=512
numprocs=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
redirect_stderr=true
stdout_logfile=/www/wwwroot/xlap.tech/storage/logs/ornament-amazon-two-pipeline.log

[program:xlap-ornament-amazon-two-priority]
