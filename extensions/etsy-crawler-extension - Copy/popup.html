<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XLAP Crawler</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <div class="brand">
          <img src="icons/offorest-icon48.png" alt="" />
          <div>
            <h1>XLAP Crawler</h1>
            <p>ETSY + VSDT + Cerebro</p>
          </div>
        </div>
        <span id="statusPill" class="pill">Idle</span>
      </header>

      <nav class="tabs" aria-label="Crawler modes">
        <button id="etsyTabBtn" class="tab active" type="button">Etsy</button>
        <button id="vsdtTabBtn" class="tab" type="button">VSDT</button>
        <button id="cerebroTabBtn" class="tab" type="button">Cerebro Test</button>
      </nav>

      <section id="etsyPanel" class="panel active">
        <label>
          Keyword
          <input id="keywordInput" type="text" value="Ornament 2D" autocomplete="off" />
        </label>
        <label>
          Số trang
          <input id="pageInput" type="number" min="1" max="20" value="1" />
        </label>
        <div class="actions">
          <button id="startBtn">Start Etsy</button>
          <button id="refreshBtn" class="secondary">Refresh</button>
        </div>
        <section class="summary">
          <div><span>Request ID</span><strong id="requestIdText">-</strong></div>
          <div><span>Pages</span><strong id="pagesText">0</strong></div>
          <div><span>Products</span><strong id="productsText">0</strong></div>
        </section>
      </section>

      <section id="vsdtPanel" class="panel">
        <label>
          Keywords or JSON
          <textarea id="inputText" spellcheck="false" placeholder="funny sticker&#10;water bottle sticker&#10;&#10;or [{&quot;Keyword&quot;:&quot;funny sticker&quot;}]"></textarea>
        </label>
        <div class="grid">
          <label>
            Seller search
            <input id="sellerSearch" value="sticker" />
          </label>
          <label>
            Top per seller
            <input id="topPerSeller" type="number" min="1" max="20" value="5" />
          </label>
        </div>
        <label>
          Helium accountId
          <input id="heliumAccountId" placeholder="Auto" />
        </label>
        <div class="actions">
          <button id="vsdtStartBtn">Start VSDT</button>
          <button id="stopBtn" class="secondary" disabled>Stop</button>
        </div>
      </section>

      <section id="cerebroPanel" class="panel">
        <label>
          ASINs for Cerebro
          <textarea id="cerebroAsins" spellcheck="false" placeholder="B087N7FCYD&#10;B09QD7SKHV&#10;B08126VNRG"></textarea>
        </label>
        <label>
          Helium accountId
          <input id="cerebroAccountId" placeholder="Auto" />
        </label>
        <div class="actions">
          <button id="testCerebroBtn">Test Cerebro</button>
          <button id="showCerebroBtn" class="secondary" disabled>Show Cerebro JSON</button>
        </div>
      </section>

      <div class="actions">
        <button id="copyBtn" class="secondary">Copy JSON</button>
        <button id="downloadBtn" class="secondary">Download JSON</button>
      </div>

      <pre id="statusBox" class="status">Ready.</pre>
      <pre id="resultBox">{}</pre>
      <pre id="cerebroBox" class="hidden"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
